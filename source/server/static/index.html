<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Loom</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<header>
			<span class="brand">Loom</span>
			<span class="live" id="live"><span class="dot"></span><span id="live-text">idle</span></span>
			<span class="stats" id="stats"></span>
			<label class="token">
				token
				<input id="token" type="password" placeholder="if the server needs one" />
			</label>
		</header>

		<main>
			<aside>
				<h2>Runs</h2>
				<ul id="run-list"></ul>
				<form id="submit">
					<input id="task-input" placeholder="Describe a task…" autocomplete="off" />
					<button>Run</button>
				</form>
			</aside>

			<section class="view">
				<div class="view-head">
					<span class="task" id="run-task">No run selected</span>
					<span class="controls" id="controls"></span>
					<span class="tabs" id="tabs">
						<button data-tab="graph" aria-selected="true">Graph</button>
						<button data-tab="events">Events</button>
						<button data-tab="diff">Diff</button>
					</span>
				</div>

				<div class="panel graph-scroll" id="panel-graph">
					<div class="graph-empty">Select a run to see its agents.</div>
				</div>
				<div class="panel" id="panel-events" hidden><div class="empty">No events.</div></div>
				<div class="panel" id="panel-diff" hidden><div class="empty">No diff yet.</div></div>
			</section>
		</main>

		<p id="error"></p>
		<script type="module" src="/app.js"></script>
	</body>
</html>
